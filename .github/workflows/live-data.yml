name: Live data

# Pulls real prices and headlines (Yahoo Finance, Google News) to prove the live path works.
# Kept out of the Tests workflow so an upstream outage cannot block unrelated changes.
on:
  schedule:
    - cron: "37 11 * * 1-5"  # weekdays 17:07 IST, after the close
  workflow_dispatch:
  push:
    paths:
      - bmm/data.py
      - bmm/news.py
      - tests/test_live.py
      - .github/workflows/live-data.yml

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v -s tests/test_live.py
        env:
          BMM_LIVE: "1"
