name: Universe check

# Verifies data/nifty100.csv against NSE's official Nifty 100 list and checks that every Yahoo
# symbol still returns prices. Weekly and manual runs open an issue when something is off.
on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 08:47 IST
  workflow_dispatch:
  push:
    paths:
      - data/nifty100.csv
      - scripts/check_universe.py
      - .github/workflows/universe-check.yml

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check universe
        id: check
        run: python scripts/check_universe.py --official --yahoo --print-official --report report.md
      - name: Open an issue
        if: failure() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Nifty 100 universe check failed ($(date -u +%F))" \
            --body-file report.md
